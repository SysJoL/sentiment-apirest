# --- Configuración General ---
spring.application.name=sentimentProject
spring.jpa.open-in-view=false

# --- Servicio Externo FastAPI ---
# Si existe la variable PYTHON_API_URL la usa, si no, usa localhost
python.api.url=${PYTHON_API_URL:http://localhost:8000/sentiment}
python.timeout=5000

# --- Base de Datos PostgreSQL ---
# Render nos dará una URL completa, username y password
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/sentimentdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Jhony2075}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Hibernate / JPA ---
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Flyway Migrations ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true