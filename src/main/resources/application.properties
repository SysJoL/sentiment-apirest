# --- Configuración General ---
spring.application.name=sentimentProject
# Evita el warning de "Open session in view"
spring.jpa.open-in-view=false

# --- Servicio Externo FastAPI ---
python.api.url=http://localhost:8000/sentiment
python.timeout=2000

# --- Base de Datos PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5434/sentimentdb
spring.datasource.username=postgres
spring.datasource.password=Jhony2075
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Hibernate / JPA ---
spring.jpa.show-sql=true
# Importante: 'none' para que no interfiera con las tablas de Flyway
spring.jpa.hibernate.ddl-auto=none
# Ayuda a Hibernate a entender el dialecto de Postgres
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Flyway Migrations ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Desactivamos baseline-on-migrate si la base de datos está vacía para que no se salte V1
spring.flyway.baseline-on-migrate=false
# Permite que Flyway se ejecute incluso si la tabla history ya existe (útil en dev)
spring.flyway.validate-on-migrate=true
# Permite borrar y recrear en caso de error (Solo desarrollo)
spring.flyway.clean-disabled=false

# --- Logs de Diagnóstico (Vital para ver por qué no corre) ---
logging.level.org.flywaydb=DEBUG